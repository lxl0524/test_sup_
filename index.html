<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 16px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .hud span b { color: #4ade80; font-size: 18px; }
  .stage {
    position: relative;
    width: min(88vw, 420px);
    aspect-ratio: 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #1e293b;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(15, 23, 42, 0.86);
    border-radius: 14px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 30px; color: #4ade80; }
  .overlay p { font-size: 15px; color: #94a3b8; line-height: 1.6; }
  .overlay .final { font-size: 20px; color: #e2e8f0; }
  button {
    font-size: 16px;
    padding: 12px 30px;
    border: none;
    border-radius: 999px;
    background: #4ade80;
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
    transition: transform .08s ease, background .2s;
  }
  button:active { transform: scale(0.95); background: #22c55e; }
  .tip { font-size: 12px; color: #64748b; }
  .pad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
    margin-top: 2px;
  }
  .pad div {
    background: #1e293b;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #94a3b8;
    user-select: none;
  }
  .pad div:active { background: #334155; color: #4ade80; }
  @media (hover: none) and (pointer: coarse) { .pad { display: grid; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span>得分 <b id="score">0</b></span>
      <span>最高 <b id="best">0</b></span>
    </div>

    <div class="stage">
      <canvas id="game" width="420" height="420"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="ovTitle">贪吃蛇</h1>
        <p id="ovText">滑动屏幕或方向键控制<br>吃到食物变长，别撞墙或咬到自己</p>
        <div class="final hidden" id="ovScore"></div>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>

    <div class="pad">
      <div></div><div data-dir="up">▲</div><div></div>
      <div data-dir="left">◀</div><div data-dir="down">▼</div><div data-dir="right">▶</div>
    </div>

    <div class="tip">空格 / 点击按钮 暂停 · 手机可用方向按钮或滑动</div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovScore = document.getElementById('ovScore');
  const startBtn = document.getElementById('startBtn');

  const GRID = 21;               // 21x21 cells
  const CELL = canvas.width / GRID;
  const START_SPEED = 140;       // ms per step
  const MIN_SPEED = 65;

  let snake, dir, nextDir, food, score, best, speed, alive, running, loopId;
  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = START_SPEED;
    alive = true;
    running = false;
    scoreEl.textContent = score;
    placeFood();
    draw();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function step() {
    if (!running || !alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return gameOver();
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 3);
      placeFood();
      restartLoop();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartLoop() {
    clearInterval(loopId);
    loopId = setInterval(step, speed);
  }

  function draw() {
    // board
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // food
    drawCircle(food.x, food.y, '#f87171', CELL * 0.36);

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const color = i === 0 ? '#4ade80' : (i % 2 ? '#22c55e' : '#16a34a');
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5, color);
    }

    // eyes on head
    const h = snake[0];
    ctx.fillStyle = '#0f172a';
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    const ex = dir.x * CELL * 0.18, ey = dir.y * CELL * 0.18;
    const px = dir.y * CELL * 0.16, py = dir.x * CELL * 0.16;
    drawDot(cx + ex + px, cy + ey + py, CELL * 0.07);
    drawDot(cx + ex - px, cy + ey - py, CELL * 0.07);
  }

  function drawCircle(gx, gy, color, r) {
    ctx.beginPath();
    ctx.arc(gx * CELL + CELL / 2, gy * CELL + CELL / 2, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function drawDot(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function roundRect(x, y, w, h, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function setDir(nx, ny) {
    // prevent reversing into yourself
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = {x: nx, y: ny};
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    restartLoop();
  }

  function togglePause() {
    if (!alive) return;
    running = !running;
    if (running) {
      overlay.classList.add('hidden');
      restartLoop();
    } else {
      clearInterval(loopId);
      showOverlay('已暂停', '按空格或点击按钮继续', null, '继续');
    }
  }

  function gameOver() {
    alive = false;
    running = false;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
    }
    showOverlay('游戏结束', '', '本局得分 ' + score, '再来一局');
  }

  function showOverlay(title, text, scoreText, btn) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    if (scoreText) {
      ovScore.textContent = scoreText;
      ovScore.classList.remove('hidden');
    } else {
      ovScore.classList.add('hidden');
    }
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  // keyboard
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === ' ' || k === 'Spacebar') { e.preventDefault(); if (!alive && overlay.classList.contains('hidden')) return; togglePause(); return; }
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); setDir(0, -1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); setDir(0, 1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); setDir(-1, 0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); setDir(1, 0); }
  });

  // touch swipe
  let touchStart = null;
  const stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', e => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  stage.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  stage.addEventListener('touchend', () => { touchStart = null; });

  // on-screen pad
  document.querySelectorAll('.pad [data-dir]').forEach(el => {
    const d = el.getAttribute('data-dir');
    el.addEventListener('touchstart', e => { e.preventDefault(); applyPad(d); }, {passive: false});
    el.addEventListener('mousedown', e => { e.preventDefault(); applyPad(d); });
  });
  function applyPad(d) {
    if (d === 'up') setDir(0, -1);
    else if (d === 'down') setDir(0, 1);
    else if (d === 'left') setDir(-1, 0);
    else if (d === 'right') setDir(1, 0);
  }

  startBtn.addEventListener('click', () => {
    if (!alive && ovTitle.textContent === '游戏结束') start();
    else if (ovTitle.textContent === '已暂停') togglePause();
    else start();
  });

  reset();
})();
</script>
</body>
</html>
